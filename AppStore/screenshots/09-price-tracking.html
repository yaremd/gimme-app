<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Screenshot 9 — Price Tracking</title>
<link rel="stylesheet" href="shared/styles.css">
<style>
  .screen-content {
    background: linear-gradient(180deg, #F5F0E8 0%, #EDE6D8 100%);
    display: flex;
    flex-direction: column;
  }
  .detail-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px var(--grid) 4px;
  }
  .nav-circle {
    width: 60px; height: 60px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.75);
    display: flex; align-items: center; justify-content: center;
  }

  /* --- Hero product image --- */
  .hero {
    margin: 4px var(--grid) 14px;
    height: 170px;
    border-radius: var(--radius-image);
    background: linear-gradient(160deg, #E7E2D8 0%, #DCD6CA 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 96px;
  }

  /* --- Title + price --- */
  .item-head { padding: 0 var(--grid) 12px; }
  .item-title {
    font-size: 34px; font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .price-line { display: flex; align-items: center; gap: 14px; }
  .price-was {
    font-size: 26px; font-weight: 600;
    color: var(--text-tertiary);
    text-decoration: line-through;
  }
  .price-now {
    font-size: 40px; font-weight: 800;
    color: var(--purchased);
    letter-spacing: -0.02em;
  }
  .drop-badge {
    font-size: 20px; font-weight: 800;
    color: #fff;
    background: var(--purchased);
    padding: 6px 14px;
    border-radius: 20px;
  }

  /* --- Price tracking card --- */
  .track-card {
    margin: 0 var(--grid) 24px;
    background: var(--surface);
    border-radius: var(--radius-card);
    overflow: hidden;
  }
  .track-head {
    display: flex; align-items: center; gap: 18px;
    padding: 20px var(--card-inner);
  }
  .track-head-title {
    font-size: 27px; font-weight: 700;
    color: var(--text-primary);
    flex: 1;
  }
  .toggle-on {
    width: 82px; height: 48px;
    border-radius: 24px;
    background: var(--ocean);
    position: relative;
    flex-shrink: 0;
  }
  .toggle-on::after {
    content: "";
    position: absolute;
    top: 4px; right: 4px;
    width: 40px; height: 40px;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .track-divider { height: 1px; background: var(--surface-border); }
  .track-body {
    padding: 18px var(--card-inner) 20px;
    display: flex; flex-direction: column; gap: 15px;
  }

  .verdict-chip {
    align-self: flex-start;
    display: flex; align-items: center; gap: 8px;
    font-size: 22px; font-weight: 700;
    color: var(--purchased);
    background: rgba(48, 209, 88, 0.14);
    padding: 9px 18px;
    border-radius: 24px;
  }

  /* Low ↔ high range track with the current-price dot */
  .range-wrap { display: flex; flex-direction: column; gap: 10px; }
  .range-track {
    height: 8px;
    border-radius: 4px;
    background: var(--surface-border);
    position: relative;
  }
  .range-dot {
    position: absolute;
    top: -8px; left: 0;
    width: 24px; height: 24px;
    border-radius: 12px;
    background: var(--purchased);
    border: 4px solid var(--surface);
  }
  .range-labels {
    display: flex; justify-content: space-between;
    font-size: 20px; font-weight: 600;
    color: var(--text-tertiary);
  }

  .history-head {
    display: flex; justify-content: space-between;
    font-size: 20px; font-weight: 600;
    color: var(--text-tertiary);
    margin-bottom: -8px;
  }

  /* Two equal-weight action capsules */
  .actions-row { display: flex; gap: 16px; }
  .pill {
    flex: 1;
    height: 68px;
    border-radius: 34px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 24px; font-weight: 700;
  }
  .pill.filled {
    background: var(--purchased);
    color: #fff;
  }
  .pill.outlined {
    background: var(--surface-elevated);
    border: 2px solid rgba(59, 141, 212, 0.35);
    color: var(--ocean);
  }
  .checked-note {
    text-align: center;
    font-size: 20px;
    color: var(--text-tertiary);
  }

  /* --- Bottom CTAs --- */
  .cta-stack {
    padding: 0 var(--grid);
    display: flex; flex-direction: column; gap: 14px;
  }
  .cta {
    height: 86px;
    border-radius: var(--radius-button);
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-size: 28px; font-weight: 700;
  }
  .cta.primary {
    background: var(--purchased);
    color: #fff;
    box-shadow: 0 12px 32px rgba(48, 209, 88, 0.35);
  }
  .cta.secondary {
    background: rgba(255, 255, 255, 0.7);
    border: 2px solid var(--surface-border);
    color: var(--text-primary);
  }
</style>
</head>
<body>
<div class="screenshot bg-emerald">

  <div class="caption">Never pay<br>full price</div>
  <div class="sub-caption">Get an alert the moment it drops</div>

  <div class="device">
    <div class="device-frame">
      <div class="device-screen">
        <div class="dynamic-island"></div>
        <div class="status-bar">
          <span class="status-time">9:41</span>
          <div class="status-icons">
            <svg width="32" height="22" viewBox="0 0 32 22"><rect x="0" y="2" width="6" height="18" rx="1.5" fill="#000"/><rect x="9" y="5" width="6" height="15" rx="1.5" fill="#000"/><rect x="18" y="9" width="6" height="11" rx="1.5" fill="#000"/><rect x="27" y="13" width="5" height="7" rx="1.5" fill="#000" opacity="0.3"/></svg>
            <svg width="30" height="22" viewBox="0 0 30 22"><path d="M15 5C20 5 24 8 27 12C24 16 20 19 15 19C10 19 6 16 3 12C6 8 10 5 15 5Z" stroke="#000" stroke-width="2" fill="none"/></svg>
            <svg width="48" height="22" viewBox="0 0 48 22"><rect x="0" y="2" width="42" height="18" rx="4" stroke="#000" stroke-width="2" fill="none"/><rect x="44" y="7" width="4" height="8" rx="1.5" fill="#000" opacity="0.4"/><rect x="3" y="5" width="34" height="12" rx="2" fill="#000"/></svg>
          </div>
        </div>

        <div class="screen-content">
          <!-- Nav -->
          <div class="detail-nav">
            <div class="nav-circle">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
            </div>
            <div class="nav-circle">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="var(--text-primary)"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
            </div>
          </div>

          <!-- Product image -->
          <div class="hero">&#9978;</div>

          <!-- Title + was/now price -->
          <div class="item-head">
            <div class="item-title">Arpenaz 6.3 Family Tent</div>
            <div class="price-line">
              <span class="price-was">&euro;299</span>
              <span class="price-now">&euro;41</span>
              <span class="drop-badge">&#8595;86%</span>
            </div>
          </div>

          <!-- Price tracking card -->
          <div class="track-card">
            <div class="track-head">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--ocean)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,7 9,13 13,9 21,17"/><polyline points="21,11 21,17 15,17"/></svg>
              <span class="track-head-title">Price tracking</span>
              <div class="toggle-on"></div>
            </div>
            <div class="track-divider"></div>

            <div class="track-body">
              <!-- Verdict -->
              <div class="verdict-chip">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--purchased)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                Lowest price yet
              </div>

              <!-- Low ↔ high range -->
              <div class="range-wrap">
                <div class="range-track"><div class="range-dot"></div></div>
                <div class="range-labels">
                  <span>&euro;41 low</span>
                  <span>&euro;299 high</span>
                </div>
              </div>

              <!-- History -->
              <div class="history-head">
                <span>Price history</span>
                <span>since 27 Jun</span>
              </div>
              <svg viewBox="0 0 420 120" width="100%" height="88" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#3B8DD4" stop-opacity="0.24"/>
                    <stop offset="100%" stop-color="#3B8DD4" stop-opacity="0.02"/>
                  </linearGradient>
                </defs>
                <path d="M0,14 H60 V42 H200 V46 H236 V14 H252 V100 H330 V104 H420 V120 H0 Z" fill="url(#fade)"/>
                <path d="M0,14 H60 V42 H200 V46 H236 V14 H252 V100 H330 V104 H420"
                      fill="none" stroke="#3B8DD4" stroke-width="5"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>

              <!-- Two equal-weight actions -->
              <div class="actions-row">
                <div class="pill filled">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a6 6 0 0 0-6 6v4l-2 3v1h16v-1l-2-3V8a6 6 0 0 0-6-6z"/><path d="M10 19a2 2 0 0 0 4 0z"/></svg>
                  Below &euro;45
                </div>
                <div class="pill outlined">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ocean)" stroke-width="2.6" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21,4 21,10 15,10"/></svg>
                  Check now
                </div>
              </div>

              <div class="checked-note">Checked 2 hours ago</div>
            </div>
          </div>

          <!-- Buy leads; Mark as Purchased steps back -->
          <div class="cta-stack">
            <div class="cta primary">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M7 4h-3v2h2l2.6 8.6L7 18h12v-2H9.4l.5-2H18l3-8H6.4L6 4z"/><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/></svg>
              Buy at &euro;41
            </div>
            <div class="cta secondary">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8,12 11,15 16,9"/></svg>
              Mark as Purchased
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

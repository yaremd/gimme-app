<!doctype html>
<!--
  App Store screenshot 6: Snap to add (new in 1.2.0). 1284x2778, like AppStore/done/1-5.

  The phone shows a real Simulator capture (snap-to-add-screen.png): iPhone 17, dark
  mode, launched with
    -AppleLocale en_US -AppleLanguages "(en)" -colorScheme dark -mockIdentify screenshot -isOnboardingComplete YES
  and the status bar set with `xcrun simctl status_bar <device> override --time 9:41
  --batteryState discharging --batteryLevel 100`. New Wish → Identify from a photo →
  the orange jacket photo in the Simulator's library.

  Export (writes AppStore/done/6.png):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=1 --window-size=1284,2778 \
      --screenshot=../done/6.png 15-snap-to-add.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gimme — Snap to add</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1284px;
    height: 2778px;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(circle at 18% 6%, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0) 46%),
      linear-gradient(172deg, #FFCF55 0%, #F8AE2C 42%, #EE8C1B 100%);
  }

  .caption {
    position: absolute;
    top: 196px;
    left: 0;
    right: 0;
    text-align: center;
  }
  .label {
    font-size: 40px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(46, 26, 0, 0.62);
  }
  .headline {
    margin-top: 30px;
    font-size: 108px;
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: #1F1300;
  }

  /* iPhone frame: titanium band, black bezel, then the screen. */
  .phone {
    position: absolute;
    top: 640px;
    left: 102px;
    width: 1080px;
    height: 2287px;
    box-sizing: border-box;
    padding: 8px;
    border-radius: 166px;
    background: linear-gradient(145deg, #5a5a60 0%, #1d1d20 26%, #2c2c30 70%, #55555b 100%);
    box-shadow:
      0 60px 120px rgba(110, 54, 0, 0.38),
      0 14px 36px rgba(0, 0, 0, 0.28);
  }
  .bezel {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 18px;
    border-radius: 158px;
    background: #050505;
  }
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 140px;
    overflow: hidden;
    background: #000;
  }
  .screen img { display: block; width: 100%; height: auto; }

  .button {
    position: absolute;
    width: 9px;
    border-radius: 4px;
    background: linear-gradient(90deg, #26262a, #55555b);
  }
  .button.left  { left: -7px; }
  .button.right { right: -7px; background: linear-gradient(270deg, #26262a, #55555b); }
</style>
</head>
<body>
  <div class="caption">
    <div class="label">Identifies it &amp; finds the best price</div>
    <div class="headline">Snap a photo.<br>Gimme does the rest.</div>

  <div class="phone">
    <div class="button left" style="top: 360px; height: 74px;"></div>
    <div class="button left" style="top: 500px; height: 140px;"></div>
    <div class="button left" style="top: 670px; height: 140px;"></div>
    <div class="button right" style="top: 560px; height: 210px;"></div>
    <div class="bezel">
      <div class="screen"><img src="snap-to-add-screen.png" alt=""></div>

</html>
